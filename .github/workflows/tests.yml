name: Stage 2-4 checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
      - run: python -m alembic -c src/infrastructure/alembic/alembic.ini history

  infrastructure:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-synthetic-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config --quiet
      - name: Validate Runflare mirror opt-in build argument
        run: |
          CHATBOT_PIP_INDEX_URL=https://mirror-pypi.runflare.com/simple/ docker compose config --format json | python -c "import json, sys; data=json.load(sys.stdin); assert data['services']['app']['build']['args']['PIP_INDEX_URL'] == 'https://mirror-pypi.runflare.com/simple/'"
      - name: Prepare bind mount for unprivileged app user
        run: |
          mkdir -p storage
          sudo chown 10001:10001 storage
      - name: Simulate Windows CRLF checkout for entrypoint
        run: |
          python -c 'from pathlib import Path; p=Path("src/host/entrypoint.sh"); p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")); assert b"\r\n" in p.read_bytes()'
      - name: Build and start infrastructure
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Apply committed Stage 4 Alembic migration
        run: |
          docker compose exec -T app python -m alembic -c src/infrastructure/alembic/alembic.ini upgrade head
          docker compose exec -T app python -m alembic -c src/infrastructure/alembic/alembic.ini current
      - name: PostgreSQL integration on disposable CI database
        run: |
          python -m pip install -r requirements-dev.txt
          CHATBOT_TEST_DATABASE_URL=postgresql+asyncpg://chatbot:ci-only-synthetic-password@127.0.0.1:5432/chatbot CHATBOT_TEST_DATABASE_ISOLATED=1 python -m pytest -q tests/test_stage4_postgres.py
      - name: Verify async database, Qdrant and persistent storage
        run: docker compose exec -T app python -m src.infrastructure.scripts.check_infrastructure
      - name: Restart without deleting volumes and recheck
        run: |
          docker compose restart app postgres qdrant
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T app python -m src.infrastructure.scripts.check_infrastructure
      - name: Show container status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 60
      - name: Stop containers without deleting volumes
        if: always()
        run: docker compose down

  windows-env:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CRLF-safe and idempotent environment initialization
        shell: pwsh
        run: |
          $TestDir = Join-Path $env:RUNNER_TEMP "stage2-env-test"
          New-Item -ItemType Directory -Force -Path $TestDir | Out-Null
          $Template = Join-Path $TestDir ".env.example"
          $EnvPath = Join-Path $TestDir ".env"
          $Lines = Get-Content -LiteralPath ".env.example"
          $Text = ($Lines -join "`r`n") + "`r`n"
          $Utf8 = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($Template, $Text, $Utf8)
          & ./scripts/initialize-development-env.ps1 -EnvPath $EnvPath -TemplatePath $Template
          $First = [IO.File]::ReadAllText($EnvPath)
          foreach ($Name in @("POSTGRES_PASSWORD", "CHATBOT_LLM_API_KEY", "CHATBOT_DEV_API_TOKEN")) {
              if (-not [regex]::IsMatch($First, "(?m)^" + $Name + "=[A-Za-z0-9_-]{43}`r?$")) {
                  throw "$Name was not generated for CRLF environment"
              }
          }
          & ./scripts/initialize-development-env.ps1 -EnvPath $EnvPath -TemplatePath $Template
          if ($First -cne [IO.File]::ReadAllText($EnvPath)) {
              throw "Re-running initialization changed existing credentials"
          }
          $ExistingEnv = Join-Path $TestDir "existing.env"
          $Preset = $Text.Replace("POSTGRES_PASSWORD=`r`n", "POSTGRES_PASSWORD=preset_dev_credential`r`n")
          [IO.File]::WriteAllText($ExistingEnv, $Preset, $Utf8)
          & ./scripts/initialize-development-env.ps1 -EnvPath $ExistingEnv -TemplatePath $Template
          $After = [IO.File]::ReadAllText($ExistingEnv)
          if (-not $After.Contains("POSTGRES_PASSWORD=preset_dev_credential")) {
              throw "Initialization unexpectedly replaced a non-empty password"
          }
          if (-not [regex]::IsMatch($After, "(?m)^CHATBOT_LLM_API_KEY=[A-Za-z0-9_-]{43}`r?$")) {
              throw "Missing second generated secret"
          }
          Write-Host "CRLF, idempotence, and preservation checks passed."
      - name: Validate Stage 3 SSE script on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Tokens = $null
          $Errors = $null
          $ScriptPath = (Resolve-Path ".\scripts\test-chat-stream.ps1").ProviderPath
          [System.Management.Automation.Language.Parser]::ParseFile(
              $ScriptPath, [ref]$Tokens, [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -ne 0) { throw "Stage 3 PowerShell script contains syntax errors." }
          Add-Type -AssemblyName System.Net.Http -ErrorAction Stop
          $Http = [System.Net.Http.HttpClient]::new()
          $Http.Dispose()
          # BOM-less UTF-8 containing Persian is parsed as ANSI by Windows PowerShell 5.1.
          # Keep the smoke script ASCII-only; non-ASCII requests use JSON Unicode escapes.
          $Bytes = [IO.File]::ReadAllBytes($ScriptPath)
          if (@($Bytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw "SSE smoke script must be ASCII-only for Windows PowerShell 5.1."
          }
          Write-Host "PowerShell 5.1 SSE script syntax and HttpClient initialization passed."

