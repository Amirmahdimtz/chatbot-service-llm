app:
  name: Chatbot Service (Development)
  version: 0.1.0
api:
  prefix: /api/v1
database:
  url: ""
vector:
  url: http://127.0.0.1:6333
  timeout_seconds: 30
  public_collection: knowledge_public
  internal_collection: knowledge_internal
storage:
  path: storage
embedding:
  base_url: http://127.0.0.1:8081
  model_name: ""
  model_version: Qwen3-Embedding-0.6B
  dimension: 1024
  batch_size: 4
  timeout_seconds: 180
reranking:
  base_url: http://127.0.0.1:8082
  model_version: BGE-reranker-v2-m3
  timeout_seconds: 180
  max_candidates: 20
ingestion:
  max_upload_bytes: 26214400
  max_pages: 300
  max_rows: 100000
  ocr_enabled: true
  ocr_language: fas+eng
  chunk_length: 512
  chunk_overlap: 64
  max_chunks: 1024
  stale_processing_minutes: 180
retrieval:
  first_stage: 20
  final: 5
  rrf_k: 60
llm:
  base_url: http://127.0.0.1:8080
  timeout_seconds: 120
  model_name: ""
  max_tokens: 256
  enable_thinking: false
  max_output_chars: 8192
  history_token_budget: 256
  max_concurrent_requests: 1
auth:
  dev_enabled: true

rag:
  context_token_budget: 512
  max_sources: 3
